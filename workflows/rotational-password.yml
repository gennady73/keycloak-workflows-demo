# This workflow monitors new user creations and enforces continuous, automated 90-day password rotations.
name: Automated Rotational Password Policy
# Starts tracking immediately upon user creation
on: user-created
enabled: true
steps:
  # Step 1: Wait 90 days of duration, then flag UPDATE_PASSWORD
  - uses: add-required-action
    after: 90d
    with:
      action: UPDATE_PASSWORD

  # Step 2: Restart the workflow chain to continuously loop the 90-day timer
  - uses: restart
    with:
      position: 0
